<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 隔空绘画</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #10131b; color: #fff; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    #input_video, #output_canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
    #output_canvas { cursor: crosshair; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: #10131b; font-size: 18px; text-align: center; line-height: 1.7; }
    #toolbar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 24px); padding: 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; background: rgba(17,21,31,.78); backdrop-filter: blur(12px); }
    button { border: 0; border-radius: 10px; padding: 9px 11px; color: #fff; background: rgba(255,255,255,.12); cursor: pointer; font: inherit; white-space: nowrap; }
    button:hover, button.active { background: #16a5ff; }
    .colors { display: flex; gap: 6px; }
    .swatch { width: 24px; height: 24px; padding: 0; border: 2px solid transparent; border-radius: 50%; }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px #16a5ff; }
    #guide { position: fixed; left: 16px; bottom: 16px; z-index: 4; max-width: min(355px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.54); font-size: 13px; line-height: 1.65; pointer-events: none; }
    #status { position: fixed; right: 16px; bottom: 16px; z-index: 4; padding: 8px 11px; border-radius: 10px; background: rgba(0,0,0,.54); font-size: 13px; }
    @media (max-width: 680px) { #toolbar { gap: 5px; padding: 7px; } #toolbar button { padding: 8px; font-size: 12px; } #toolbar .label { display: none; } #guide { font-size: 12px; } }
  </style>
</head>
<body>
  <div id="loading">正在启动摄像头与手势识别…<br>请允许浏览器使用摄像头。</div>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>
  <div id="toolbar">
    <button id="penBtn" class="active">✏️ <span class="label">画笔</span></button>
    <button id="eraserBtn">🧽 <span class="label">橡皮</span></button>
    <div class="colors" aria-label="颜色"></div>
    <button id="undoBtn">↩ <span class="label">撤销</span></button>
    <button id="clearBtn">🗑 <span class="label">清空</span></button>
    <button id="saveBtn">↓ <span class="label">保存</span></button>
  </div>
  <div id="guide"><b>手势说明</b><br>🤏 食指与拇指捏合：绘画 / 擦除<br>🖐 张开手掌：显示或隐藏手势菜单<br>✌️ 剪刀手：雪花消散并清空画面<br>☝️ 菜单打开时，食指悬停在项目上即可选择<br>双手同时出现：用两根食指缩放画面<br><small>快捷键：Ctrl/⌘ + Z 撤销，C 清空，S 保存</small></div>
  <div id="status">画笔 · 绿色 · 5px</div>

  <script>
    const video = document.getElementById('input_video');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const state = { tool: 'pen', color: '#36e86d', size: 5, scale: 1, baseScale: 1, zoomStart: 0, menu: false, menuCooldown: 0 };
    let strokes = [], currentStroke = null, particles = [], dissolving = false, hoverButton = null, hoverFrames = 0;
    const colors = ['#36e86d', '#ff4d6d', '#4da3ff', '#ffd43b', '#ffffff'];
    const colorBox = document.querySelector('.colors');

    function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resizeCanvas); resizeCanvas();
    function setTool(tool) { state.tool = tool; document.getElementById('penBtn').classList.toggle('active', tool === 'pen'); document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser'); updateStatus(); }
    function setColor(color) { state.color = color; [...colorBox.children].forEach(b => b.classList.toggle('active', b.dataset.color === color)); updateStatus(); }
    function updateStatus() { status.textContent = `${state.tool === 'pen' ? '画笔' : '橡皮'} · ${state.tool === 'pen' ? state.color : '30px'} · ${state.size}px`; }
    colors.forEach(color => { const b = document.createElement('button'); b.className = 'swatch'; b.style.background = color; b.dataset.color = color; b.title = color; b.onclick = () => setColor(color); colorBox.append(b); });
    document.getElementById('penBtn').onclick = () => setTool('pen');
    document.getElementById('eraserBtn').onclick = () => setTool('eraser');
    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('clearBtn').onclick = () => { strokes = []; currentStroke = null; };
    document.getElementById('saveBtn').onclick = saveImage;
    setColor(state.color); updateStatus();
    addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } if (e.key.toLowerCase() === 'c') strokes = []; if (e.key.toLowerCase() === 's') { e.preventDefault(); saveImage(); } });
    function undo() { if (currentStroke) currentStroke = null; else strokes.pop(); }
    function saveImage() { const image = document.createElement('canvas'); image.width = canvas.width; image.height = canvas.height; const imageCtx = image.getContext('2d'); drawStrokes(imageCtx); const a = document.createElement('a'); a.download = `air-drawing-${Date.now()}.png`; a.href = image.toDataURL('image/png'); a.click(); }
    function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function indexUp(l) { return l[8].y < l[6].y && l[12].y > l[10].y && l[16].y > l[14].y && l[20].y > l[18].y; }
    function palmOpen(l) { return l[8].y < l[6].y && l[12].y < l[10].y && l[16].y < l[14].y && l[20].y < l[18].y; }
    function pinch(l) { return distance(l[4], l[8]) < .055; }
    function victory(l) { return l[8].y < l[6].y && l[12].y < l[10].y && l[16].y > l[14].y && l[20].y > l[18].y; }
    // Hands returns coordinates in the camera's direction, while the visible canvas is mirrored.
    // Flip the x coordinate once here so drawing stays directly under the fingertip.
    function rawPoint(l) {
    const x = l[8].x * canvas.width;
    const y = l[8].y * canvas.height;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    return {
        x: (x - cx) / state.scale + cx,
        y: (y - cy) / state.scale + cy
    };
}
    function drawStrokes(target = ctx) { const cx = canvas.width / 2, cy = canvas.height / 2; target.save(); target.translate(cx, cy); target.scale(state.scale, state.scale); target.translate(-cx, -cy); target.lineCap = target.lineJoin = 'round'; strokes.forEach(s => { if (!s.points.length) return; target.beginPath(); target.strokeStyle = s.color; target.lineWidth = s.size; target.moveTo(s.points[0].x, s.points[0].y); for (let i = 1; i < s.points.length; i++) target.lineTo(s.points[i].x, s.points[i].y); target.stroke(); }); target.restore(); }
    function erase(point) { const radius = 30 / state.scale; strokes = strokes.map(s => ({ ...s, points: s.points.filter(p => distance(p, point) > radius) })).filter(s => s.points.length); }
    const menuItems = [
      { label: '画笔', action: () => setTool('pen') }, { label: '橡皮', action: () => setTool('eraser') },
      ...colors.map(c => ({ label: '●', color: c, action: () => setColor(c) })), { label: '细', action: () => { state.size = 3; updateStatus(); } }, { label: '中', action: () => { state.size = 8; updateStatus(); } }, { label: '粗', action: () => { state.size = 15; updateStatus(); } }
    ];
    function drawMenu() { const w = canvas.width, h = canvas.height, x = w * .13, y = h * .17, bw = w * .18, bh = h * .105; ctx.save(); ctx.translate(w, 0); ctx.scale(-1, 1); ctx.fillStyle = 'rgba(12,16,25,.88)'; ctx.roundRect(w*.1,h*.1,w*.8,h*.8,20); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke(); menuItems.forEach((item, i) => { const col = i % 3, row = Math.floor(i / 3), bx = x + col * w * .23, by = y + row * h * .14; ctx.fillStyle = hoverButton === item ? 'rgba(22,165,255,.7)' : 'rgba(255,255,255,.12)'; ctx.fillRect(bx, by, bw, bh); ctx.fillStyle = item.color || '#fff'; ctx.font = '20px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(item.label, bx + bw / 2, by + bh / 2); item.bounds = { x: bx / w, y: by / h, w: bw / w, h: bh / h }; }); ctx.restore(); }
    function menuSelect(tip) { const item = menuItems.find(i => tip.x >= i.bounds?.x && tip.x <= i.bounds.x+i.bounds.w && tip.y >= i.bounds.y && tip.y <= i.bounds.y+i.bounds.h); if (item === hoverButton) { hoverFrames++; if (hoverFrames > 24) { item.action(); hoverButton = null; hoverFrames = 0; } } else { hoverButton = item || null; hoverFrames = 0; } }
    function dissolve() { dissolving = true; particles = strokes.flatMap(s => s.points.filter((_, i) => i % 2 === 0).map(p => ({ x: (p.x-canvas.width/2)*state.scale+canvas.width/2, y: (p.y-canvas.height/2)*state.scale+canvas.height/2, vx: (Math.random()-.5)*2, vy: Math.random()*2+1, color: s.color, size: s.size*state.scale, alpha: 1 }))); strokes = []; }
    function drawParticles() { for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= .018; if (p.alpha <= 0 || p.y > canvas.height) { particles.splice(i,1); continue; } ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1; if (!particles.length) dissolving = false; }
    function handleHands(hands) { const l = hands[0]; if (state.menuCooldown) state.menuCooldown--; if (palmOpen(l) && !state.menuCooldown) { state.menu = !state.menu; state.menuCooldown = 35; currentStroke = null; return; } if (state.menu) { menuSelect(l[8]); return; } if (victory(l) && strokes.length && !dissolving) { dissolve(); return; } if (hands.length === 2) { const d = distance(hands[0][8], hands[1][8]); if (!state.zoomStart) { state.zoomStart = d; state.baseScale = state.scale; } else state.scale = Math.min(5, Math.max(.5, state.baseScale * d / state.zoomStart)); currentStroke = null; return; } state.zoomStart = 0; if (pinch(l)) { const p = rawPoint(l); if (state.tool === 'pen') { if (!currentStroke) { currentStroke = { color: state.color, size: state.size, points: [] }; strokes.push(currentStroke); } const previous = currentStroke.points.at(-1); if (!previous || distance(previous, p) > 1) currentStroke.points.push(p); } else erase(p); } else currentStroke = null; }
    function onResults(results) { loading.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height); dissolving ? drawParticles() : drawStrokes(); if (results.multiHandLandmarks?.length) { handleHands(results.multiHandLandmarks); results.multiHandLandmarks.forEach(l => { drawConnectors(ctx, l, HAND_CONNECTIONS, { color: '#36e86d', lineWidth: 1 }); drawLandmarks(ctx, l, { color: '#ff4d6d', lineWidth: 1, radius: 3 }); }); } if (state.menu) drawMenu(); }
    const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: .7, minTrackingConfidence: .7 }); hands.onResults(onResults);
    const camera = new Camera(video, { onFrame: async () => hands.send({ image: video }), width: 1280, height: 720 });
    camera.start().catch(() => { loading.innerHTML = '无法启动摄像头。<br>请检查浏览器权限后刷新页面。'; });
  </script>
</body>
</html>
